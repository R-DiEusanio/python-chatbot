<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assistant Didattico</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gojs/release/go-debug.js"></script>

  <style>
    body { background-color: #f8f9fa; }
    header { border-bottom: 1px solid #dee2e6; }
    #messages { height: 300px; overflow-y: auto; background: #fff; }
    .input-group textarea { border-radius: 20px; }
    .input-group button { border-radius: 20px; }
    .thinking-dots { color: #6c757d; font-style: italic; }
  </style>
</head>
<body>

  <header class="bg-white py-3 px-4 d-flex justify-content-between align-items-center">
    <h1 class="m-0 fw-bold text-dark">🌍 Assistant-AI</h1>
  </header>

  <main class="col-md-9 col-lg-10 p-4">
    <div id="chat-container" class="bg-white p-4 rounded shadow-sm mb-4">
      <h3 class="text-primary mb-3">Chatta con Rengar</h3>
      <div id="messages" class="border p-3 mb-3 rounded"></div>
      <div class="input-group">
        <textarea id="query" class="form-control" rows="1" placeholder="Scrivi la tua domanda..."></textarea>
        <button onclick="sendQuery()" class="btn btn-primary ms-2">Invia</button>
      </div>
    </div>

    <div id="diagram-container" class="bg-white p-4 rounded shadow-sm" style="display: none;">
      <div class="d-flex justify-content-between align-items-center">
        <h5 class="text-primary">Diagramma generato:</h5>
        <button class="btn btn-outline-secondary btn-sm" onclick="openFullScreenModal()" title="Schermo intero">⛶</button>
      </div>
      <div id="diagramDiv" style="width:100%; height:500px; background:#f1f3f5;"></div>
    </div>
  </main>

  <div class="modal fade" id="fullScreenModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-fullscreen">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Diagramma a schermo intero</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-0">
          <div id="diagramDivFull" style="width:100%; height:100%; background:#f1f3f5;"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let lastDiagramData = null;

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("query").focus();
    });

    async function sendQuery() {
      const userQuery = document.getElementById("query").value.trim();
      if (!userQuery) return;

      const messagesDiv = document.getElementById("messages");
      messagesDiv.innerHTML += `<div class="text-end mb-2"><span class="badge bg-primary text-wrap">${userQuery.replace(/\n/g, '<br>')}</span></div>`;

      const thinkingDots = document.createElement("div");
      thinkingDots.className = "thinking-dots my-2";
      thinkingDots.innerText = "...";
      messagesDiv.appendChild(thinkingDots);

      document.getElementById("query").value = "";
      messagesDiv.scrollTop = messagesDiv.scrollHeight;

      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: userQuery })
        });
        const data = await res.json();

        thinkingDots.remove();

        if (data.answer) {
          messagesDiv.innerHTML += `<div class="text-start mb-2"><span class="badge bg-secondary text-wrap">${data.answer.replace(/\n/g, '<br>')}</span></div>`;
          messagesDiv.scrollTop = messagesDiv.scrollHeight;
        } else if (data.diagram) {
          document.getElementById("diagram-container").style.display = "block";
          lastDiagramData = data.diagram;
          renderDiagram("diagramDiv", lastDiagramData);
          messagesDiv.innerHTML += `<div class="text-start mb-2"><span class="badge bg-success">✅ Diagramma generato!</span></div>`;
          messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

      } catch (error) {
        thinkingDots.remove();
        console.error("Errore rendering diagramma:", error);
        messagesDiv.innerHTML += `<div class="text-start mb-2"><span class="badge bg-danger">⚠️ Errore nella richiesta o rendering diagramma.</span></div>`;
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }
    }

    function renderDiagram(divId, diagramData) {
      if (typeof diagramData === "string") diagramData = JSON.parse(diagramData);

      diagramData.nodes = diagramData.nodes.map(n => ({ ...n, key: isNaN(n.key) ? n.key : Number(n.key) }));
      diagramData.links = diagramData.links.map(l => ({ ...l, from: isNaN(l.from) ? l.from : Number(l.from), to: isNaN(l.to) ? l.to : Number(l.to) }));

      const $ = go.GraphObject.make;
      const diagram = $(go.Diagram, divId, {
        initialContentAlignment: go.Spot.Center,
        "undoManager.isEnabled": true,
        layout: $(go.LayeredDigraphLayout, {
          direction: 90, // Layout verticale dall'alto verso il basso
          layerSpacing: 70,
          columnSpacing: 50,
          layeringOption: go.LayeredDigraphLayout.LayerLongestPathSource
        })
      });

      diagram.nodeTemplate = $(go.Node, "Auto",
  { isShadowed: true, shadowBlur: 10, shadowColor: "rgba(0, 0, 0, 0.2)" },
  $(go.Shape, "RoundedRectangle", {
    stroke: "#6c757d",
    strokeWidth: 2,
    parameter1: 10
  },
  new go.Binding("fill", "color")
),
  $(go.Panel, "Vertical", { margin: 8 },
    $(go.TextBlock, { font: "bold 12pt sans-serif", textAlign: "center", margin: 4 }, new go.Binding("text", "text")),
    $(go.TextBlock, {
      font: "10pt sans-serif",
      stroke: "#333",
      textAlign: "center",
      wrap: go.TextBlock.WrapFit,
      width: 150
    }, new go.Binding("text", "description"))
  )
);



      diagram.linkTemplate = $(go.Link,
        {
          routing: go.Link.AvoidsNodes,
          curve: go.Link.Bezier,
          corner: 10
        },
        $(go.Shape, { strokeWidth: 2, stroke: "#4A90E2" }),
        $(go.Shape, { toArrow: "Standard", stroke: "#4A90E2", fill: "#4A90E2" })
      );

      diagram.model = new go.GraphLinksModel(diagramData.nodes, diagramData.links);
    }

    function openFullScreenModal() {
      if (lastDiagramData) {
        const modal = new bootstrap.Modal(document.getElementById('fullScreenModal'));
        modal.show();
        renderDiagram("diagramDivFull", lastDiagramData);
      }
    }
  </script>

</body>
</html>
