<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assistant Didattico</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-warning-subtle">

  <!-- Header -->
  <header class="bg-warning py-3 px-4 d-flex justify-content-between align-items-center">
    <h1 class="m-0 fw-bold text-primary">DIDAttIKA</h1>
    <nav>
      <a href="#" class="me-3 text-dark text-decoration-none">La scuola semplice</a>
      <a href="#" class="me-3 text-dark text-decoration-none">La didattika ideale</a>
      <button class="btn btn-primary">Ricevi la tua demo</button>
    </nav>
  </header>

  <!-- Layout principale -->
  <div class="container-fluid">
    <div class="row mt-4">

      <!-- Sidebar sinistra -->
      <aside class="col-md-2 bg-light p-3 rounded shadow-sm mb-4">
        <h5 class="text-primary">Menu</h5>
        <ul class="list-unstyled">
          <li><a href="#" class="text-decoration-none text-dark">Link 1</a></li>
          <li><a href="#" class="text-decoration-none text-dark">Link 2</a></li>
          <li><a href="#" class="text-decoration-none text-dark">Link 3</a></li>
          <li><a href="#" class="text-decoration-none text-dark">Link 4</a></li>
        </ul>
      </aside>

      <!-- Chat al centro -->
      <main class="col-md-8">
        <div id="chat-container" class="bg-light p-4 rounded shadow-sm mx-auto" style="max-width: 100%;">
          <h3 class="text-primary text-center mb-3">Assistente Didattico</h3>
          <div id="messages" class="border rounded p-3 mb-3 bg-white" style="height: 300px; overflow-y: auto;"></div>
          <div class="input-group">
            <textarea id="query" class="form-control" rows="2" placeholder="Scrivi la tua domanda..."></textarea>
            <button onclick="sendQuery()" class="btn btn-primary">Invia</button>
          </div>
        </div>
      </main>

      <!-- Sidebar destra -->
      <aside class="col-md-2 bg-light p-3 rounded shadow-sm mb-4">
        <h5 class="text-primary">Personalizza AI</h5>
        <div class="mb-3">
          <label for="instruction" class="form-label small">Istruzione:</label>
          <textarea id="instruction" class="form-control" rows="3" placeholder="Ad esempio: rispondi in modo formale"></textarea>
        </div>
        <button class="btn btn-outline-primary btn-sm w-100 mb-2" onclick="saveInstruction()">Salva istruzioni</button>

        <hr>

        <h6 class="text-primary">Azioni rapide</h6>
        <button class="btn btn-outline-secondary btn-sm w-100 mb-2" onclick="setPreset('Crea una presentazione PowerPoint ordinata, chiara e schematica basata sul contenuto.')">
          Creazione Slides
        </button>
        <button class="btn btn-outline-secondary btn-sm w-100" onclick="setPreset('Crea una mappa concettuale sintetica e ben organizzata basata sul contenuto.')">
          Creazione Mappa Concettuale
        </button>
      </aside>

    </div>
  </div>

  <!-- Script -->
  <script>
    let userInstruction = "";

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("query").focus();
    });

    function saveInstruction() {
      userInstruction = document.getElementById("instruction").value.trim();
      alert("Istruzioni salvate!");
    }

    function setPreset(presetText) {
      document.getElementById("instruction").value = presetText;
      saveInstruction();
    }

    async function sendQuery() {
  const userQuery = document.getElementById("query").value.trim();
  if (!userQuery) return;

  const fullQuery = userInstruction ? `${userInstruction}\n${userQuery}` : userQuery;

  const messagesDiv = document.getElementById("messages");
  messagesDiv.innerHTML += `<div class="text-end mb-2"><span class="badge bg-primary text-wrap">${userQuery.replace(/\n/g, '<br>')}</span></div>`;
  
  const thinkingDots = document.createElement("div");
  thinkingDots.className = "thinking-dots my-2";
  thinkingDots.innerText = "...";
  messagesDiv.appendChild(thinkingDots);

  document.getElementById("query").value = "";
  messagesDiv.scrollTop = messagesDiv.scrollHeight;

  try {
    const res = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query: fullQuery })
    });
    const data = await res.json();

    thinkingDots.remove(); 
    messagesDiv.innerHTML += `<div class="text-start mb-2"><span class="badge bg-secondary text-wrap">${data.answer.replace(/\n/g, '<br>')}</span></div>`;
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  } catch (error) {
    thinkingDots.remove(); 
    messagesDiv.innerHTML += `<div class="text-start mb-2"><span class="badge bg-danger">⚠️ Errore nella richiesta. Riprova.</span></div>`;
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }
}

  </script>

</body>
</html>
