<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Assistant-AI</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --color-ai: #eef4fb;
      --color-user: #0d6efd;
      --color-success: #198754;
      --color-error: #dc3545;
      --color-bg: #f2f4f7;
      --color-white: #ffffff;
      --color-border: #dce1e7;
      --font: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--color-bg);
      font-family: var(--font);
      margin: 0;
    }

    header {
      background-color: var(--color-white);
      border-bottom: 1px solid var(--color-border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
    }

    header h1 {
      font-size: 1.75rem;
      color: #212529;
      margin: 0;
    }

    main {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 3rem;
    }

    #chat-container {
      background-color: var(--color-white);
      padding: 4rem;
      border-radius: 1rem;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
      margin-bottom: 2rem;
    }

    #chat-container h3 {
      font-size: 1.5rem;
      color: var(--color-user);
      margin-bottom: 1.5rem;
      font-weight: 600;
    }

    #messages {
      max-height: 350px;
      overflow-y: auto;
      padding: 1rem;
      background-color: #fbfcfd;
      border: 1px solid var(--color-border);
      border-radius: 0.75rem;
      margin-bottom: 1.5rem;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar {
      width: 6px;
    }

    #messages::-webkit-scrollbar-thumb {
      background-color: #adb5bd;
      border-radius: 4px;
    }

    .user-message,
    .ai-message,
    .svg-message,
    .error-message {
      border-radius: 20px;
      padding: 10px 16px;
      display: inline-block;
      max-width: 75%;
      font-size: 1rem;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .user-message {
      background-color: var(--color-user);
      color: #fff;
    }

    .ai-message {
      background-color: var(--color-ai);
      color: #212529;
    }

    .svg-message {
      background-color: var(--color-success);
      color: white;
    }

    .error-message {
      background-color: var(--color-error);
      color: white;
    }

    .thinking-dots {
      color: #6c757d;
      font-style: italic;
      padding-left: 0.5rem;
    }

    .input-group textarea {
      border-radius: 1.5rem;
      resize: none;
      padding: 0.75rem 1rem;
      box-shadow: none;
      border: 1px solid var(--color-border);
      transition: border-color 0.2s;
    }

    .input-group textarea:focus {
      border-color: var(--color-user);
      outline: none;
    }

    .input-group button {
      border-radius: 1.5rem;
      white-space: nowrap;
      padding: 0.6rem 1.2rem;
      font-weight: 500;
      transition: background-color 0.2s ease;
    }

    .input-group button:hover {
      background-color: #0b5ed7;
    }

    #svg-container {
      background-color: var(--color-white);
      border-radius: 1rem;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
      padding: 1.5rem;
    }

    #svg-container h5 {
      color: var(--color-user);
      margin-bottom: 1rem;
      font-weight: 600;
    }

    #svgObject {
      width: 100%;
      height: 600px;
      border: 1px solid #ced4da;
      border-radius: 0.5rem;
      background: var(--color-bg);
    }
  </style>
</head>

<body>
  <header>
    <h1>🌍 Assistant-AI</h1>
  </header>

  <main>
    <div id="chat-container">
      <h3>Chatta con Rengar</h3>
      <div id="messages"></div>
      <div class="input-group">
        <textarea id="query" class="form-control" rows="1" placeholder="Scrivi la tua domanda..."></textarea>
        <button onclick="sendQuery()" class="btn btn-primary ms-2">Invia</button>
      </div>
    </div>

    <div id="svg-container" style="display: none;">
      <h5>Ecco a te!</h5>
      <object id="svgObject" type="image/svg+xml"></object>
    </div>
  </main>

  <!-- Script invariato -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("query").focus();
    });

    async function sendQuery() {
      const userQuery = document.getElementById("query").value.trim();
      if (!userQuery) return;

      const messagesDiv = document.getElementById("messages");
      messagesDiv.innerHTML += `<div class="text-end mb-2"><div class="user-message">${userQuery.replace(/\n/g, '<br>')}</div></div>`;

      const thinkingDots = document.createElement("div");
      thinkingDots.className = "thinking-dots my-2";
      thinkingDots.innerText = "...";
      messagesDiv.appendChild(thinkingDots);

      document.getElementById("query").value = "";
      messagesDiv.scrollTop = messagesDiv.scrollHeight;

      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: userQuery })
        });
        const data = await res.json();

        thinkingDots.remove();

        if (data.answer) {
          messagesDiv.innerHTML += `<div class="text-start mb-2"><div class="ai-message">${data.answer.replace(/\n/g, '<br>')}</div></div>`;
        }

        if (data.svg_url) {
          document.getElementById("svg-container").style.display = "block";
          document.getElementById("svgObject").data = data.svg_url;
          messagesDiv.innerHTML += `<div class="text-start mb-2"><div class="svg-message">✅ Certamente, ti preparo subito il diagramma.</div></div>`;
        }

        messagesDiv.scrollTop = messagesDiv.scrollHeight;

      } catch (error) {
        thinkingDots.remove();
        console.error("Errore richiesta:", error);
        messagesDiv.innerHTML += `<div class="text-start mb-2"><div class="error-message">⚠️ Errore durante la richiesta.</div></div>`;
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }
    }
  </script>
</body>

</html>
