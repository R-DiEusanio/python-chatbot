<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assistant Didattico</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    body {
      background-color: #f8f9fa;
    }

    header {
      border-bottom: 1px solid #dee2e6;
    }

    #messages {
      height: 300px;
      overflow-y: auto;
      background: #fff;
    }

    .input-group textarea {
      border-radius: 20px;
    }

    .input-group button {
      border-radius: 20px;
    }

    .thinking-dots {
      color: #6c757d;
      font-style: italic;
    }

    #svgContainer {
      width: 100%;
      height: 600px;
      background: #f1f3f5;
      border: 1px solid #dee2e6;
    }
  </style>
</head>

<body>
  <header class="bg-white py-3 px-4 d-flex justify-content-between align-items-center">
    <h1 class="m-0 fw-bold text-dark">🌍 Assistant-AI</h1>
  </header>

  <main class="col-md-9 col-lg-10 p-4">
    <div id="chat-container" class="bg-white p-4 rounded shadow-sm mb-4">
      <h3 class="text-primary mb-3">Chatta con Rengar</h3>
      <div id="messages" class="border p-3 mb-3 rounded"></div>
      <div class="input-group">
        <textarea id="query" class="form-control" rows="1" placeholder="Scrivi la tua domanda..."></textarea>
        <button onclick="sendQuery()" class="btn btn-primary ms-2">Invia</button>
      </div>
    </div>

    <!-- Contenitore file SVG -->
    <div id="svg-container" class="bg-white p-4 rounded shadow-sm" style="display: none;">
      <h5 class="text-primary">Diagramma generato:</h5>
      <object id="svgObject" type="image/svg+xml" style="width:100%; height:600px;"></object>
    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("query").focus();
    });

    async function sendQuery() {
      const userQuery = document.getElementById("query").value.trim();
      if (!userQuery) return;

      const messagesDiv = document.getElementById("messages");
      messagesDiv.innerHTML += `<div class="text-end mb-2"><span class="badge bg-primary text-wrap">${userQuery.replace(/\n/g, '<br>')}</span></div>`;

      const thinkingDots = document.createElement("div");
      thinkingDots.className = "thinking-dots my-2";
      thinkingDots.innerText = "...";
      messagesDiv.appendChild(thinkingDots);

      document.getElementById("query").value = "";
      messagesDiv.scrollTop = messagesDiv.scrollHeight;

      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: userQuery })
        });
        const data = await res.json();

        thinkingDots.remove();

        if (data.answer) {
          messagesDiv.innerHTML += `<div class="text-start mb-2"><span class="badge bg-secondary text-wrap">${data.answer.replace(/\n/g, '<br>')}</span></div>`;
        }

        if (data.svg_url) {
          document.getElementById("svg-container").style.display = "block";
          document.getElementById("svgObject").data = data.svg_url;
          messagesDiv.innerHTML += `<div class="text-start mb-2"><span class="badge bg-success">Diagramma SVG generato!</span></div>`;
        }

        messagesDiv.scrollTop = messagesDiv.scrollHeight;

      } catch (error) {
        thinkingDots.remove();
        console.error("Errore richiesta:", error);
        messagesDiv.innerHTML += `<div class="text-start mb-2"><span class="badge bg-danger">⚠️ Errore durante la richiesta.</span></div>`;
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }
    }
  </script>
</body>

</html>
