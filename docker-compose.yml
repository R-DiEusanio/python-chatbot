services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatbot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - db
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      PGVECTOR_CONNECTION_STRING: postgresql+psycopg://postgres:postgres@db:5432/chatbot
    ports:
      - "5000:5000"
    # Se vuoi hot-reload in dev:
    # volumes:
    #   - .:/app

volumes:
  pgdata:
